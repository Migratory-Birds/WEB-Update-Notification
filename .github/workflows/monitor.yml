name: Monitor Website

on:
  schedule:
    - cron: '*/10 * * * *'  # 10分ごとに実行
  workflow_dispatch:

jobs:
  check_website:
    runs-on: ubuntu-latest
    steps:
      # - name: Checkout repository
      #  uses: actions/checkout@v3

        
      - name: Set Current Date
        run: |
          TZ=Asia/Tokyo
          echo "CURRENT_DATE=$(date '+%Y-%m-%d')"

      - name: Create File with Date
        run: touch file_$(date +%Y%m%d).txt

      - name: Fetch Website Content
        run: curl -sL https://www.elegaku.com/cast/schedule/castCode/329878 > website_$(date +%Y%m%d).html

      - name: Compare with Previous Version
        run: |
          if [ -f website_previous_$(date +%Y%m%d).html ]; then
            diff website_previous_$(date +%Y%m%d).html website_$(date +%Y%m%d).html || curl -H "Content-Type: application/json" \
               -X POST \
               -d '{"content": "スケジュールが更新されました。"}' \
               https://discord.com/api/webhooks/1367284131909734524/rlj6EN4ti6pgYALxaahl3OTcp5qfjNlUCLH052OYzKHI3J59Inn0bvpNOl6w0ggpPkex
          fi
          mv website_$(date +%Y%m%d).html website_previous_$(date +%Y%m%d).html