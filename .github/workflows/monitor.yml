name: Monitor Website

on:
  #schedule:
    #- cron: '*/5 22-23 * * *'    # 5分ごとに実行 (日本時間 7:00)
    #- cron: '*/5 0-11 * * *'  # 5分ごとに実行 (日本時間 9:00～20:00)
    # - cron: '*/5 8-20 * * *'  # 10分ごとに実行
  workflow_dispatch:

jobs:
  check_website:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Set Current Date
        run: |
          TZ=Asia/Tokyo
          echo "CURRENT_DATE=$(date '+%Y-%m-%d')" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch Website Content
        run: |
          curl -sL https://www.elegaku.com/cast/schedule/castCode/329878 > website.html

      - name: Compare with Previous Version
        run: |
          if [ -f website_previous.html ]; then

            if diff -B website_previous.html website.html | grep 'class.*' >/dev/null; then
              echo "Changes found"

              curl -H "Content-Type: application/json" \
               -X POST \
               -d '{"content": "update web"}' \
               https://discord.com/api/webhooks/1367284131909734524/rlj6EN4ti6pgYALxaahl3OTcp5qfjNlUCLH052OYzKHI3J59Inn0bvpNOl6w0ggpPkex

            else

              echo "No changes detected."

            fi
          fi

          mv website.html website_previous.html

          git config --global user.email "GitHubActions@example.com"
          git config --global user.name "GitHub Actions"

          git add .
          git commit -m "Automated commit from GitHub Actions"
          git push origin main

