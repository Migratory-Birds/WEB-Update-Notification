name: Monitor Website

on:
  schedule:
    - cron: '*/10 * * * *'  # 10分ごとに実行

jobs:
  check_website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Fetch Website Content
        run: curl -sL hhttps://www.elegaku.com/profile/top/castCode/329878/ > website.html

      - name: Compare with Previous Version
        run: |
          if [ -f website_previous.html ]; then
            diff website_previous.html website.html || echo "Website updated!"
          fi
          mv website.html website_previous.html