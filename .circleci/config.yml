version: 2.1

workflows:
  check_website:
    triggers:
      - schedule:
          cron: "0,10,20,30,40,50 * * * *"
          filters:
            branches:
              only: circleci-project-setup
    jobs:
      - check_site

jobs:
  check_site:
    docker:
      - image: circleci/python:3.8
    steps:
      - checkout
      - run:
          name: Check website updates
          command: |
            TZ=Asia/Tokyo
            echo $(date '+%Y-%m-%d')
            echo "CURRENT_DATE=$(date '+%Y-%m-%d')"
            curl -sL https://www.elegaku.com/cast/schedule/castCode/369619 > website_$(date +%Y%m%d).html
            if [ -f website_previous_$(date +%Y%m%d).html ]; then
            diff website_previous_$(date +%Y%m%d).html website_$(date +%Y%m%d).html || curl -H "Content-Type: application/json" \
              -X POST \
              -d "a{\"content\": \"nishimura - update circleci \"}" \
              https://discord.com/api/webhooks/1367284131909734524/rlj6EN4ti6pgYALxaahl3OTcp5qfjNlUCLH052OYzKHI3J59Inn0bvpNOl6w0ggpPkex
            fi
            mv website_$(date +%Y%m%d).html website_previous_$(date +%Y%m%d).html
